name: CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build, test and analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Java 11 and 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            11
            25
          cache: gradle

      - name: Build, test, Checkstyle, SpotBugs and coverage
        run: >-
          bash ./gradlew --no-daemon
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_11_X64,JAVA_HOME
          clean build

      - name: Mutation testing for Kevin components
        run: >-
          bash ./gradlew --no-daemon
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_11_X64,JAVA_HOME
          pitest

      - name: Save test and quality reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-reports
          path: |
            build/reports/tests/test/
            build/test-results/test/
            build/reports/checkstyle/
            build/reports/spotbugs/
            build/reports/jacoco/
            build/reports/pitest/
          if-no-files-found: ignore
          retention-days: 14
