name: CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Java 11 and 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            11
            25
          cache: gradle

      - name: Build and run tests
        run: >-
          bash ./gradlew --no-daemon
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_11_X64,JAVA_HOME
          clean build

      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            build/reports/tests/test/
            build/test-results/test/
          if-no-files-found: ignore
          retention-days: 14
