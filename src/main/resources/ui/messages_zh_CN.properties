recovery.question.blinds.1=10 和 20
recovery.question.blinds.2=20 和 40
recovery.question.fold=已弃牌的玩家还能赢得底池吗？
recovery.question.fold.0=能，只要牌最好
recovery.question.fold.1=能，只要下过盲注
recovery.question.fold.2=不能
recovery.question.private=交接时应显示谁的手牌？
recovery.question.private.0=仅显示选中的真人玩家的手牌
recovery.question.private.1=所有真人玩家的手牌
recovery.question.private.2=所有六名玩家的手牌
recovery.question.board=翻牌圈会发出几张公共牌？
recovery.question.board.0=两张
recovery.question.board.1=三张
recovery.question.board.2=五张
recovery.question.allIn=已全下后离开的玩家还能赢得本手有资格争夺的筹码吗？
recovery.question.allIn.0=不能，离开后立即弃牌
recovery.question.allIn.1=只有在河牌前回来才可以
recovery.question.allIn.2=能，获奖资格仍然保留
recovery.question.refund=下注中无人跟注的超额部分如何处理？
recovery.question.refund.0=退还给下注者
recovery.question.refund.1=由跟注者平分
recovery.question.refund.2=发给主底池的赢家
recovery.question.sidePot=筹码不足而全下的玩家能赢得未参与的边池吗？
recovery.question.sidePot.0=能，只要牌最好
recovery.question.sidePot.1=不能
recovery.question.sidePot.2=庄家可以
recovery.question.tie=有资格争夺同一底池的玩家以最佳牌型打平时，如何分配？
recovery.question.tie.0=筹码更多的玩家获胜
recovery.question.tie.1=退还所有筹码
recovery.question.tie.2=打平的赢家平分该底池
recovery.question.quit=未全下且仍在参与的玩家离开时会怎样？
recovery.question.quit.0=立即弃牌
recovery.question.quit.1=仍可赢得底池
recovery.question.quit.2=退还其下注
recovery.question.topUp=增加桌上筹码会为账号创造新筹码吗？
recovery.question.topUp.0=每次都会
recovery.question.topUp.1=不会，只预留已有筹码
recovery.question.topUp.2=在两手之间操作就会
