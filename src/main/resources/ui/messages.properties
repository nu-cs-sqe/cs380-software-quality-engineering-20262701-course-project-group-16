recovery.question.blinds=What are the fixed small and big blinds?
recovery.question.blinds.0=5 and 10
recovery.question.blinds.1=10 and 20
recovery.question.blinds.2=20 and 40
recovery.question.fold=Can a player who folded still win the pot?
recovery.question.fold.0=Yes, if their cards are best
recovery.question.fold.1=Yes, if they posted a blind
recovery.question.fold.2=No
recovery.question.private=Whose private cards should be revealed during a handoff?
recovery.question.private.0=Only the selected human player’s
recovery.question.private.1=Every human player’s
recovery.question.private.2=All six players’
recovery.question.board=How many community cards are dealt on the flop?
recovery.question.board.0=Two
recovery.question.board.1=Three
recovery.question.board.2=Five
recovery.question.allIn=Can an all-in player who leaves still win eligible chips from that hand?
recovery.question.allIn.0=No, their cards are folded immediately
recovery.question.allIn.1=Only if they return before the river
recovery.question.allIn.2=Yes, their eligibility is preserved
recovery.question.refund=What happens to the uncalled excess of a bet?
recovery.question.refund.0=It is returned to the bettor
recovery.question.refund.1=It is split among the callers
recovery.question.refund.2=It goes to the winner of the main pot
recovery.question.sidePot=Can a short all-in win a side pot they did not contribute to?
recovery.question.sidePot.0=Yes, if they have the best hand
recovery.question.sidePot.1=No
recovery.question.sidePot.2=Yes, if they are the dealer
recovery.question.tie=What happens when eligible players tie for the best hand in a pot?
recovery.question.tie.0=The player with the bigger stack wins
recovery.question.tie.1=All chips are refunded
recovery.question.tie.2=The tied winners split that pot
recovery.question.quit=What happens when an active player who is not all-in leaves?
recovery.question.quit.0=They fold immediately
recovery.question.quit.1=They keep their chance to win
recovery.question.quit.2=Their bets are refunded
recovery.question.topUp=Does adding chips to your table stack create new account chips?
recovery.question.topUp.0=Yes, every time
recovery.question.topUp.1=No, it reserves chips you already own
recovery.question.topUp.2=Yes, if done between hands
